[project]
name = "ai-dubbing"
version = "0.1.0"
description = "Automatic English to Polish video dubbing with voice cloning and timing synchronisation"
readme = "README.md"
authors = [
    { name = "Dmytro Harasiuk", email = "garasyuk2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "coqui-tts>=0.28.0",
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchcodec>=0.17.0",
    "transformers[torch]>=5.20.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'"},
  { index = "pytorch-cu132", marker = "sys_platform != 'darwin'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ai-dubbing = "ai_dubbing:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
